    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Product Card</title>

        <script src="https://cdn.tailwindcss.com"></script>
    </head>

    <body class="bg-blue-50 min-h-screen flex items-center justify-center">

        <div class="w-80 bg-white rounded-2xl shadow-lg overflow-hidden">

            <!-- Product Image -->
            <div class="bg-blue-100 p-6">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="Blue Running Shoe"
                    class="w-full h-52 object-contain" />
            </div>

            <!-- Product Details -->
            <div class="p-5">

                <span class="text-sm font-semibold text-blue-600">
                    Sports
                </span>

                <h2 class="text-xl font-bold text-gray-800 mt-2">
                    Running Shoes
                </h2>

                <p class="text-gray-500 text-sm mt-2">
                    Comfortable and stylish running shoes for everyday use.
                </p>

                <!-- Rating -->
                <div class="flex items-center gap-1 mt-3">
                    <span class="text-yellow-400">★ ★ ★ ★ ★</span>
                    <span class="text-sm text-gray-500">(120)</span>
                </div>

                <!-- Price & Button -->
                <div class="flex items-center justify-between mt-5">

                    <div>
                        <p class="text-2xl font-bold text-blue-600">
                            $59.99
                        </p>
                    </div>

                    <button class="bg-blue-600 text-white px-4 py-2 rounded-lg
                 hover:bg-blue-700 transition duration-200">
                        Add to Cart
                    </button>

                </div>

            </div>
        </div>

    </body>

    </html>
</body>

</html>
